[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bamm-cnn-detectors"
version = "1.0.0"
description = "Train, evaluate and run the CNN Clean / CNN Broadcast AI-music detectors from the BAMM paper (ISMIR 2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "librosa>=0.10",
    "scipy>=1.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "huggingface_hub>=0.20",
    # The released weights were trained and tested with TF 2.11 (Docker) and 2.15 (host).
    "tensorflow>=2.11,<2.16",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.11"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
