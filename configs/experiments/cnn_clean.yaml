# Reproduces the training run behind the released "CNN Clean" weights.
# Every value below matches the config_snapshot.yaml saved with those weights.
experiment:
  name: cnn_clean
  description: "CNN Clean: trained on clean foreground music (paper, Sec. 4.1.1)"
  tags:
    task: ai_music_detection

dataset: configs/datasets/fma_medium_sonics_suno_v35.yaml
features: configs/features/mel_8k_128.yaml
model: configs/models/spec_cnn_v1.yaml

training:
  epochs: 100
  batch_size: 50
  learning_rate: 0.001
  optimizer: adam
  seed: 123

  crop:
    window_sec: 5            # 5 s windows = 38 frames at 8 kHz, hop 1024
    strategy: random
    samples_per_file: 5      # random 5 s crops drawn from each track per epoch

  shuffle_buffer_multiplier: 2

  callbacks:
    early_stopping:
      monitor: val_loss
      patience: 15
    reduce_lr:
      monitor: val_loss
      factor: 0.5
      patience: 5

evaluation:
  metrics: [accuracy, f1, auc_roc, eer]
  plots: [confusion_matrix, det_curve, roc_curve]
  threshold_sweep:
    enabled: true
    range: [0.1, 0.9]
    step: 0.05
